{{each areas as a i}}
<div class="flex align-items-flex-start margin-bottom-4">
    <span class="props-item-title">
        <span class="iconfont mr5 gray cp" mx-click="@:{remove.area}({i:{{=i}}})" title="删除限制区域">&#xe600;</span>
        X坐标：
    </span>
    <mx-number class="width-140" *value="{{#a.x}}" mx-change="@:{stop}()" mx-input="@:{update.area.value}({i:{{=i}},key:'x'})"/>
</div>
<div class="flex align-items-flex-start margin-bottom-4">
    <span class="props-item-title">Y坐标：</span>
    <mx-number class="width-140" *value="{{#a.y}}" mx-change="@:{stop}()" mx-input="@:{update.area.value}({i:{{=i}},key:'y'})"/>
</div>
<div class="flex align-items-flex-start margin-bottom-4">
    <span class="props-item-title">宽：</span>
    <mx-number class="width-140" *value="{{#a.width}}" mx-change="@:{stop}()" mx-input="@:{update.area.value}({i:{{=i}},key:'width'})"/>
</div>
<div class="flex align-items-flex-start margin-bottom-4">
    <span class="props-item-title">高：</span>
    <mx-number class="width-140" *value="{{#a.height}}" mx-change="@:{stop}()" mx-input="@:{update.area.value}({i:{{=i}},key:'height'})"/>
</div>
{{/each}}
<button class="btn btn-brand fr" disabled="{{=areas.length>=1}}?" mx-click="@:{add.area}()">添加限制区域</button>
