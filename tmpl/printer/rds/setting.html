<div class="dialog-header-shadow position-sticky z-index-7"></div>
<div class="dialog-header background-color-fff position-sticky top-0 z-index-8 dialog-header-with-shadow">
    <h5 class="tag-h5">RDS打印服务设置</h5>
</div>
<div class="dialog-body">
    {{if error}}
        {{=exf(error.message)}}
    {{else}}
        <div class="flex align-items-center">
            <div class="width-120 tr">打印机：</div>
            <mx-dropdown class="width-350" *list="{{#list}}" *selected="{{=printer.name}}" mx-change="@:{set.printer}({key:'name'})"/>
        </div>
        <div class="flex align-items-center mt-20">
            <div class="width-120 tr">方向：</div>
            <mx-dropdown class="width-350" *list="{{#layouts}}" *text-key="text" *value-key="value" *selected="{{=printer.l}}" mx-change="@:{set.printer}({key:'l'})"/>
        </div>
        <div class="flex align-items-center mt-20">
            <div class="width-120 tr">双面打印：</div>
            <label class="tag-label mwp100 cursor-pointer flex align-items-center">
                <input class="switch-input pa" type="checkbox" checked="{{=printer.ts}}?" mx-change="@:{set.printer.two.side}()"/>
                <i class="switch-button unselectable pr"></i>
            </label>
        </div>
        <div class="flex align-items-center mt-20">
            <div class="width-120 tr">打印份数：</div>
            <mx-number *min="1" *value="{{#printer.nc}}" mx-input="@:{update.num}({key:'nc'})"/>
        </div>
        <div class="flex align-items-center mt-20">
            <div class="width-120 tr">左页边距：</div>
            <mx-number *min="0" *value="{{#printer.pl}}" mx-input="@:{update.num}({key:'pl'})"/>
        </div>
        <div class="flex align-items-center mt-20">
            <div class="width-120 tr">上页边距：</div>
            <mx-number *min="0" *value="{{#printer.pt}}" mx-input="@:{update.num}({key:'pt'})"/>
        </div>
        <div class="flex align-items-center mt-20">
            <div class="width-120 tr">右页边距：</div>
            <mx-number *min="0" *value="{{#printer.pr}}" mx-input="@:{update.num}({key:'pr'})"/>
        </div>
        <div class="flex align-items-center mt-20">
            <div class="width-120 tr">下页边距：</div>
            <mx-number *min="0" *value="{{#printer.pb}}" mx-input="@:{update.num}({key:'pb'})"/>
        </div>
    {{/if}}
</div>
<div class="dialog-footer flex justify-content-flex-end align-items-center position-sticky bottom-0 z-index-6 dialog-footer-with-shadow background-color-fff">
    <button mx-click="@:{apply}();" class="btn tc cursor-pointer btn-brand" type="button">应用</button>
    <button mx-click="@:{cancel}();" class="btn tc cursor-pointer ml10" type="button">取消</button>
</div>
<div class="dialog-footer-shadow position-sticky z-index-5"></div>
