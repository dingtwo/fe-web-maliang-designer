<i class="iconfont toolbar-item cursor-pointer align-items-center justify-content-center{{if scale<=min}} toolbar-item-disabled{{/if}}" mx-click="@:{stage.scale}({s:'-'})" title="{{=i18n('@:{lang#zoom.out}')}}">&#xe602;</i>
<b class="toolbar-text tc">{{=scale*100}}%</b>
<i class="iconfont toolbar-item cursor-pointer align-items-center justify-content-center{{if scale>=max}} toolbar-item-disabled{{/if}}" mx-click="@:{stage.scale}({s:'+'})" title="{{=i18n('@:{lang#zoom.in}')}}">&#xe699;</i>
