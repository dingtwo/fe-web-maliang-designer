<div class="dialog-header-shadow position-sticky z-index-7"></div>
<div class="dialog-header position-sticky top-0 background-color-fff flex align-items-center dialog-header-with-shadow z-index-8">
    <h5 class="tag-h5">模板</h5>
    <a class="tag-a ml10" href="https://github.com/xinglie/report-designer/issues/28" rel="noopener noreferrer" target="_blank">如何不显示或更换模板接口?</a>
</div>
<div class="dialog-body min-height-500">
    <div class="flex flex-wrap-wrap">
        {{if error}}
            <div class="tc mt30 fontsize-16">{{=error.message}}</div>
        {{else}}
            {{each list as p}}
                <div title="{{=p.title}}">
                    <div class="item-container cursor-pointer flex align-items-center justify-content-center overflow-hidden height-100" mx-click="@:{use}({src:'{{#p}}'})">
                        {{=p.title}}
                    </div>
                </div>
            {{/each}}
        {{/if}}
    </div>
</div>
