  style="left:{{=props.x}}{{=unit}};top:{{=props.y}}{{=unit}};color:{{=props.forecolor}};{{if props.background}}background:{{=props.background}};{{/if}}font-size:{{=props.fontsize}}{{=unit}};min-height:{{=props.height}}{{=unit}};letter-spacing:{{=props.letterspacing}}{{=unit}};opacity:{{=props.alpha}};{{if props.styleBold}}font-weight:bold;{{/if}}{{if props.styleItalic}}font-style:italic;{{/if}}{{if props.styleUnderline||props.styleStrike||props.styleOverline}}text-decoration:{{if props.styleStrike}}line-through{{else if props.styleOverline}}overline{{else}}underline{{/if}};{{/if}}align-items:{{=props.vpos}};justify-content:{{=props.hpos}};width:{{=props.width}}{{=unit}};transform:rotate({{=props.rotate}}deg);font-family:{{=props.fontfamily}};{{if bw}}border:{{=bw}}{{=unit}} {{=props.bordertype}} {{=props.bordercolor}};{{/if}}{{if props.autoReturn}}word-break:break-all;{{else}}max-height:{{=props.height}}px;{{/if}}{{if props.hpos === 'center'}}text-align:center;{{/if}}"
