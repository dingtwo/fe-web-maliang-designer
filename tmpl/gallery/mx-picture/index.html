<div class="pic background-color-fff cursor-pointer padding-4 pr height-100{{if disabled}} notallowed{{/if}}" mx-click="{{=!disabled}}?@:{choose.picture}()">
    {{if src}}
    <div class="item wp100 hp100" style="background-image:url('{{=src}}')">
        <i class="iconfont remove pa" mx-click="{{=!disabled}}?@:{clear.image}()" title="{{=i18n('@:{lang#remove.image}')}}">&#xe624;</i>
    </div>
    {{else}}
    <div class="pic-tip tc color-999">
        {{=i18n('@:{lang#click.choose.image}')}}
    </div>
    {{/if}}
</div>
