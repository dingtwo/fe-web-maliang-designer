<div class="dialog-header-shadow position-sticky z-index-7"></div>
<div class="dialog-header background-color-fff position-sticky top-0 z-index-8 dialog-header-with-shadow">
    <h5 class="tag-h5">自定义函数</h5>
</div>
<div class="dialog-body min-height-500 unselectable">
    <mx-codemirror class="codemirror" style="width:848px;height:480px" *value="{{#parts[1]}}" mx-cmchange="@:{update.format}()">
        loading...
    </mx-codemirror>
</div>
<div class="dialog-footer flex justify-content-flex-end position-sticky bottom-0 z-index-6 dialog-footer-with-shadow background-color-fff">
    <button mx-click="@:{apply}();" class="btn tc cursor-pointer btn-brand" type="button">应用</button>
    <button mx-click="@:{close}();" class="btn tc cursor-pointer ml10" type="button">取消</button>
</div>
<div class="dialog-footer-shadow position-sticky z-index-5"></div>
