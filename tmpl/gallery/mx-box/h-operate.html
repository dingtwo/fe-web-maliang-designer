<div class="flex align-items-center justify-content-space-between flex-wrap-wrap">
    <i class="iconfont fontsize-26 icon cursor-pointer margin-bottom-4{{if disabled}} icon-disabled{{/if}}" title="{{=i18n('@:{lang#mx-gallery.box.insert.row.before}')}}" mx-click="{{=!disabled}}?@:{add.row}({to:'top'})">&#xe618;</i>
    <i class="iconfont fontsize-26 icon cursor-pointer flipy margin-bottom-4{{if disabled}} icon-disabled{{/if}}" title="{{=i18n('@:{lang#mx-gallery.box.insert.row.after}')}}" mx-click="{{=!disabled}}?@:{add.row}()">&#xe618;</i>
    <i class="iconfont fontsize-26 icon cursor-pointer flipx margin-bottom-4{{if disabled}} icon-disabled{{/if}}" title="{{=i18n('@:{lang#mx-gallery.box.insert.box.left}')}}" mx-click="{{=!disabled}}?@:{add.col}({to:'left'})">&#xe616;</i>
    <i class="iconfont fontsize-26 icon cursor-pointer margin-bottom-4{{if disabled}} icon-disabled{{/if}}" title="{{=i18n('@:{lang#mx-gallery.box.insert.box.right}')}}" mx-click="{{=!disabled}}?@:{add.col}()">&#xe616;</i>
    <i class="iconfont fontsize-26 icon cursor-pointer margin-bottom-4{{if disabled||!canDel}} icon-disabled{{/if}}" title="{{=i18n('@:{lang#mx-gallery.box.delete.box}')}}" mx-click="{{=!disabled&&canDel}}?@:{del.cell}()">&#xe62a;</i>
    <i class="iconfont fontsize-26 icon cursor-pointer margin-bottom-4 r180{{if disabled||!canMergeLeft}} icon-disabled{{/if}}" title="{{=i18n('@:{lang#mx-gallery.box.merge.to.left}')}}" mx-click="{{=!disabled&&canMergeLeft}}?@:{merge.cell}({to:'left'})">&#xe610;</i>
    <i class="iconfont fontsize-26 icon cursor-pointer margin-bottom-4{{if disabled||!canMergeRight}} icon-disabled{{/if}}" title="{{=i18n('@:{lang#mx-gallery.box.merge.to.right}')}}" mx-click="{{=!disabled&&canMergeRight}}?@:{merge.cell}()">&#xe610;</i>
    <i class="iconfont fontsize-26 icon cursor-pointer margin-bottom-4{{if disabled}} icon-disabled{{/if}}" title="{{=i18n('@:{lang#mx-gallery.box.split.box}')}}" mx-click="{{=!disabled}}?@:{split.cell}()">&#xe672;</i>
</div>
