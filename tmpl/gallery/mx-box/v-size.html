<mx-number disabled="{{=disabled}}?" *min="{{#minWidth}}" *fixed="{{#fixed}}" *step="{{#step}}" *value="{{#read(row.width)}}" class="margin-bottom-4" mx-change="@:{stop}()" mx-input="@:{update.row.width}()"/>
<mx-number disabled="{{=disabled}}?" *min="{{#minHeight}}" *fixed="{{#fixed}}" *step="{{#step}}" *value="{{#read(cell.height)}}" mx-change="@:{stop}()" mx-input="@:{update.cell.height}()"/>
