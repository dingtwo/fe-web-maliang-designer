<div class="dialog-backdrop full-fill{{if !removeClass}} anim-mask{{/if}}" style="z-index:{{=zIndex-1}}" id="_mx_mask_{{=$viewId}}"></div>
<div class="scroll-cnt overflow-auto wp100 hp100 flex full-fill outline-none" style="z-index:{{=zIndex}};" tabindex="0" id="_mx_scroll_{{=$viewId}}">
    <div class="dialog-center{{if !removeClass }} anim-body{{/if}}" id="_mx_body_{{=$viewId}}" style="width:{{=width}}px;">
        {{if closable}}
            <span class="iconfont dialog-close dialog-close-sticky position-sticky cursor-pointer z-index-1" mx-click="@:{close}()">&#xe624;</span>
        {{/if}}
        <div class="dialog-content pr contain-paint" id="_mx_cnt_{{=$viewId}}">
            <div class="loading tc loading-ext"><span class="loading-anim"></span></div>
        </div>
    </div>
</div>
