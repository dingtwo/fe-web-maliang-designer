{{if fields.length}}
{{each fields as field}}
<mx-number *min="{{#min}}" *fixed="{{#fixed}}" *step="{{#step}}" *max="{{#max}}" *value="{{#columns[field.id]}}" mx-input="@:{update.width}({id:'{{=field.id}}'})" mx-change="@:{stop}()" disabled="{{=disabled}}?"/>
{{/each}}
{{else}}
<div class="tip color-999{{if disabled}} notallowed{{/if}}">{{=i18n('@:{lang#mx-gallery.need.bind.data}')}}</div>
{{/if}}
