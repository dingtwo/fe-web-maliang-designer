{{each data as d i last}}
    <div class="flex align-items-flex-start margin-bottom-4">
        <span class="props-item-title tr">
            {{if data.length>1}}
            <span class="iconfont mr5{{if disabled}} color-666 cursor-not-allowed{{else}} gray cursor-pointer{{/if}}" mx-click="{{=!disabled}}?@:{remove.fx}({i:{{=i}}})" title="删除函数">&#xe6b3;</span>
            {{/if}}
            函数：
        </span>
        <textarea class="textarea width-140 height-100" disabled="{{=disabled}}?" mx-change="@:{stop}()" mx-input="@:{update.prop}({i:{{=i}},key:'fn',native:'value'})">{{=d.fn}}</textarea>
    </div>
    <div class="flex align-items-center margin-bottom-4">
        <span class="props-item-title tr">颜色：</span>
        <mx-color class="width-140" *align="right" *disabled="{{#disabled}}" *color="{{#d.color}}" mx-input="@:{update.prop}({i:{{=i}},key:'color',use:'color'})"/>
    </div>
    <div class="flex align-items-center margin-bottom-4">
        <span class="props-item-title tr">线条类型：</span>
        <mx-dropdown class="width-140" *disabled="{{#disabled}}" *selected="{{=d.graphType}}" *list="{{#lineTypes}}" *text-key="text" *value-key="value" mx-change="@:{update.prop}({i:{{=i}},key:'graphType',use:'value'})"/>
    </div>
    <div class="flex align-items-center margin-bottom-4">
        <span class="props-item-title tr">设置范围：</span>
        <label class="tag-label mwp100 cursor-pointer flex align-items-center">
            <input class="switch-input pa" type="checkbox" checked="{{=d.range!=null}}?" disabled="{{=disabled}}?" mx-change="@:{update.range.setting}({i:{{=i}}})"/>
            <i class="switch-button unselectable pr"></i>
        </label>
    </div>
    {{if d.range}}
    <div class="flex align-items-center margin-bottom-4">
        <span class="props-item-title tr">取值范围：</span>
        <mx-range class="width-140" *disabled="{{#disabled}}" *value="{{#d.range}}" mx-input="@:{update.prop}({i:{{=i}},key:'range',use:'range'})"/>
    </div>
    {{/if}}
    <div class="flex align-items-center margin-bottom-4">
        <span class="props-item-title tr">设置取样：</span>
        <label class="tag-label mwp100 cursor-pointer flex align-items-center">
            <input class="switch-input pa" type="checkbox" checked="{{=d.nSamples!=null}}?" disabled="{{=disabled}}?" mx-change="@:{update.samples.setting}({i:{{=i}}})"/>
            <i class="switch-button unselectable pr"></i>
        </label>
    </div>
    {{if d.nSamples!=null}}
    <div class="flex align-items-center margin-bottom-4">
        <span class="props-item-title tr">取样：</span>
        <mx-number class="width-140" disabled="{{=disabled}}?" *value="{{#d.nSamples}}" *min="10" mx-change="@:{stop}()" mx-input="@:{update.prop}({i:{{=i}},key:'nSamples',use:'value'})"/>
    </div>
    {{/if}}
    <div class="flex align-items-center margin-bottom-4">
        <span class="props-item-title tr">填充：</span>
        <label class="tag-label mwp100 cursor-pointer flex align-items-center">
            <input class="switch-input pa" type="checkbox" checked="{{=d.closed}}?" disabled="{{=disabled}}?" mx-change="@:{update.prop}({i:{{=i}},key:'closed',native:'checked'})"/>
            <i class="switch-button unselectable pr"></i>
        </label>
    </div>
    {{if !last}}
    <div class="item-spliter"></div>
    {{/if}}
{{/each}}
<button class="btn tc cursor-pointer btn-brand fr" disabled="{{=disabled}}?" mx-click="@:{add.fx}()">添加函数</button>
