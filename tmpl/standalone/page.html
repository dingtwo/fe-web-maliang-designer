<div style="position:relative;width:{{=page.width}}px;height:{{=page.height*page.pages}}px;background:{{=page.background}};{{if page.backgroundImage}}background-image:url({{=page.backgroundImage}});background-repeat:{{=page.backgroundRepeat=='full'?'no-repeat':page.backgroundRepeat}};background-size:{{if page.backgroundRepeat=='full'}}100% 100%{{else}}{{=page.backgroundWidth}}px {{=page.backgroundHeight}}px;background-position:{{=page.backgroundXOffset}}{{=unit}} {{=page.backgroundYOffset}}{{=unit}}{{/if}}{{/if}}">
    {{each elements as e}}
        <mx-vframe src="../elements/{{=e.type}}/index" *props="{{#e.props}}" *unit="{{=unit}}"/>
    {{/each}}
</div>
