        <script>

            function getParams() {
              const url = new URL(location.href);
              const params = {};
              url.searchParams.forEach((value, key) => {
                try {
                  params[key] = decodeURIComponent(value);
                  if (key === 'watermark') {
                    params[key] = JSON.parse(params[key]);
                  }
                } catch (error) {
                  console.log("🚀 ~ url.searchParams.forEach ~ error:", error)
                }
              });

              return params;
            }

            window.grayVersion = getParams().traceId ? '1' : '';

            function getEnv() {
                console.log('环境', window.RUN_CONFIG);
                var hostname = window.location.hostname;

            }
