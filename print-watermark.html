<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8" />
<meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
<link type="image/x-icon" href="//gw.alicdn.com/tfs/TB1gRomUlr0gK0jSZFnXXbRRXXa-200-200.png"
    rel="shortcut icon">
<title>打印水印</title>
<script type="text/javascript">window.RUN_CONFIG = { env: "sit" };</script>
<style>
html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  -webkit-print-color-adjust: exact;
}

#print_btn {
  position: fixed;
  z-index: 9999;
  top: 30px;
  right: 30px;
  border: 1px solid #ddd;
  border-radius: 15px #ddd;
  padding: 5px;
  width: 100px;
  text-align: center;
  cursor: pointer;
}

@media print {
  #print_btn {
    display: none;
  }
}

#pdf-container {
  position: relative;
}

#img-container {
  position: relative;
  text-align: center;
}

#img-container img{
  max-width: 100%;
}

#watermark-container {
  position: absolute;
  top: 0px;
  left: 0px;
  z-index: 9;
  height: 100%;
  width: 100%;
  /* background-size: 332px; */
  pointer-events: none;
  background-repeat: repeat;
}

</style>
</head>

<body>

<button id="print_btn">打印</button>
<div style="position: relative;">
  <div id="pdf-container">

  </div>
  <div id="img-container"></div>
  <div id="watermark-container"></div>
</div>
<script src="https://unpkg.freshfood.cn/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://unpkg.freshfood.cn/@uiw/watermark.js@1.0.0/dist/watermark.min.js"></script>
<script>

init();

const params = getParams();

window.addEventListener('afterprint', confirmPrintTip);

function init() {
  const printBtnEle = document.querySelector('#print_btn');
  const pdfContainerElem = document.querySelector('#pdf-container');
  const watermarkContainerElem = document.querySelector('#watermark-container');

  const params = getParams();
  const { url, type, content, watermark, watermarkType = 'span', isShowPageNum = true} = params;

  const size = getTextSize(content);
  const lastWatermark = {
    content,
    width: size.width,
    height: size.height,
    ...watermark,
  }

  const isSpanWatermark = watermarkType === 'span';

  if (content && watermarkType === 'canvas') {
    showWatermark({
      container: watermarkContainerElem,
      content,
      ...lastWatermark,
    });
  }

  if (type === 'pdf') {
    showPdf({
      isShowPageNum,
      url,
      container: pdfContainerElem,
      watermark: isSpanWatermark ?  lastWatermark : undefined
    });
  } else if (['png', 'jpeg', 'jpg'].includes(type)) {
    showImg({
      isShowPageNum,
      url,
      watermark: isSpanWatermark ? lastWatermark : undefined
    })
  }

  printBtnEle.addEventListener('click', () => {
    print();
  });

}

function confirmPrintTip() {
  reConfirm({
    title: "提示",//题目
    text: "确认打印完成?"//题目内容
  })
    .then(function () {
      printCount();
    })
    .catch(function () {
      console.log('no print')
    })
}

function reConfirm(obj) {
  let { title, text } = obj
  let confirmElem = document.createElement('div');
  confirmElem.innerHTML = `
    <div id="mask">
    <div id="confirmBox">
    <div id="confirmTitle">${title}</div>
    <div id="confirmText">
          ${text}
    </div>
    <div id="confirmButton">
      <button>取消</button>
      <button>确定</button>
    </div>
    </div>
    </div>
  `;
  document.body.appendChild(confirmElem)
  //渲染组件
  let ConfirmPromise = new Promise((resolve, reject) => {
    let bu = confirmElem.getElementsByTagName('button')
    bu[0].addEventListener('click', function () {
      document.body.removeChild(confirmElem)
      //移除组件
      reject()
    })
    bu[1].addEventListener('click', function () {
      document.body.removeChild(confirmElem)
      //移除组件
      resolve()
    })
  })
  //绑定点击事件
  return ConfirmPromise;
}

function printCount() {

  const { callbackData } = params;
  if (callbackData) {
    let lastCallBackData = {};
    let token;
    try {
      token = JSON.parse(localStorage.getItem('login-token'));
    } catch (error) {}
    if (!token) {
      console.error('没有 token, 登录失效');
      reLogin();
    }

    try {
      lastCallBackData = JSON.parse(decodeURIComponent(callbackData));
      const { url, options, ...data } = lastCallBackData;
      if (!url) {
        console.error("🚀 ~ file: print-watermark.html:105 ~ printCount ~ url不存在:", url, callbackData)
        return ;
      }


      const raw = JSON.stringify(data);

      const requestOptions = {
        method: 'POST',
        headers: {
            "login-token": token,
            "Content-Type": "application/json"
        },
        body: raw,
      };

      fetch(url, requestOptions)
      .then(response => response.text())
      .then(result => {
        console.log("🚀 ~ file: print-watermark.html:173 ~ printCount ~ result:", result)
      })
      .catch(error => {
        console.log("🚀 ~ file: print-watermark.html:174 ~ printCount ~ error:", error)

      });

    } catch (error) {
      console.log("🚀 ~ file: printCount.ts:54 ~ printCount ~ error:", error, callbackData)
    }
  }
}

let reLogin = () => {
  /* 重新登陆 */
  let warning = false;
  window.location.href = `/?from=${encodeURIComponent(location.href)}`;
};

function getParams() {
  const url = new URL(location.href);
  const params = {};
  url.searchParams.forEach((value, key) => {
    try {
      params[key] = decodeURIComponent(value);
      if (key === 'watermark') {
        params[key] = JSON.parse(params[key]);
      }
    } catch (error) {
      console.log("🚀 ~ file: print-watermark.html:142 ~ url.searchParams.forEach ~ error:", error, value, key)

    }
  });
  console.log("🚀 ~ file: print-watermark.html:134 ~ getParams ~ params:", params)

  return params;
}

function print() {
  try {
    document.execCommand('print');
  } catch (error) {

  }
}

function showWatermarkBySpan(props) {
  const {
    container,
    content,
    // repeat = true,
    style,
    ...rest
  } = props;

  const textElem = document.createElement('span');
  container.appendChild(textElem);
  textElem.innerHTML = content;

  textElem.style.position = 'absolute';
  textElem.style.zIndex = 999;

  css(textElem, style);

}

function showWatermark(props) {
  const {
    container,
    content,
    ...rest
  } = props;

  const watermark = new Watermark({
    content,
    rotate: 0,
    offsetLeft: 20,
    offsetTop: 20,
    ...rest,
  });

  watermark.create().then((mark) => {
    container.style.backgroundImage = `url(${mark})`
  })
  .catch((err) => {
    console.log(err, 'err')
  })
}

function getTextSize(text) {
  const textElem = document.createElement('span');
  document.body.appendChild(textElem);
  textElem.innerHTML = text;
  const size = textElem.getBoundingClientRect();
  document.body.removeChild(textElem);
  return size;
}


function showImg(props) {
  const { isShowPageNum, url, watermark } = props;

  const imgContainerElem = document.querySelector('#img-container');
  const imgElem = document.createElement('img');

  imgElem.src = url;
  imgContainerElem.appendChild(imgElem);

  if (watermark) {

    let content = watermark.content;

    if (isShowPageNum) {
      content = `1-1/${content}`;
    }

    showWatermarkBySpan({
      container: document.body,
      ...watermark,
      content,
      style: {
        bottom: '20px',
        right: '20px',
        width: watermark.width,
        height: watermark.height,
        color: 'rgba(0,0,0,.35)',
        width:'100%',
        textAlign:'center',
        fontSize:'24px',
        ...watermark.style,
      }
    })
  }

}

function css(elem, style) {
  if (typeof style === 'object') {
    for(const key in style) {
      elem.style[key] = style[key];
    }
  }
}


function showPdf(props) {
  const {
    isShowPageNum,
    url,
    container,
    watermark,
  } = props;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.freshfood.cn/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const loadingTask = pdfjsLib.getDocument(url);

  loadingTask.promise.then((pdf) => {
    const numPages = pdf.numPages;

    for (let index = 0; index < numPages; index++) {

      const pageNum = index + 1;

      let content = watermark.content;

      if (isShowPageNum) {
        content = `${numPages}-${pageNum}/${content}`;
      }

      renderPage(pdf, container, pageNum, { ...watermark, content }, isShowPageNum);
    }
  });
}

function renderPage(pdf, container, pageNum, watermark, isShowPageNum) {
  pdf.getPage(pageNum)
  .then((page) => {
    const scale = 1.5;
    const viewport = page.getViewport({ scale });
    // Support HiDPI-screens.
    const outputScale = window.devicePixelRatio || 1;

    const div = document.createElement('div');
    const canvas = document.createElement('canvas');
    container.appendChild(div);
    div.appendChild(canvas);
    css(div, {position: 'relative'})
    const context = canvas.getContext("2d");
    const width = viewport.width;
    const height = viewport.height;

    canvas.width = Math.floor(width * outputScale);
    canvas.height = Math.floor(height * outputScale);
    canvas.style.width = Math.floor(width) + "px";
    canvas.style.height = Math.floor(height) + "px";

    if (watermark) {

      showWatermarkBySpan({
        container: div,
        ...watermark,
        style: {
          bottom: '20px',
          right: '20px',
          width: watermark.width,
          height: watermark.height,
          color: 'rgba(0,0,0,.15)',
          fontSize: '16px',
          ...watermark.style,
        }
      })
    }

    const transform = outputScale !== 1
      ? [outputScale, 0, 0, outputScale, 0, 0]
      : null;

    const renderContext = {
      canvasContext: context,
      transform,
      viewport,
    };
    page.render(renderContext);
  });
}

</script>
</body>
</html>
